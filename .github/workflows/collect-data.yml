# Zamanlanmış veri toplama işleri.
# AdMob (2. aşama), Google Play ve App Store (3. aşama), Gmail + Claude + telefon bildirimi (4. aşama).
# Claude, Claude Code CLI ile abonelik token'ıyla (CLAUDE_CODE_OAUTH_TOKEN) çalışır; API anahtarı kullanılmaz.
# Her çalışma Supabase'deki sync_runs tablosuna kaydedilir.
name: Veri topla

on:
  schedule:
    - cron: '0 5 * * *'     # Her gün 08:00 İstanbul (05:00 UTC): tüm veriler + Claude analizi
    - cron: '0 15 * * *'    # Her gün 18:00 İstanbul: tüm veriler tekrar (akşam güncel olsun)
    - cron: '30 */6 * * *'  # 6 saatte bir: politika mailleri ve inceleme durumları
    - cron: '0 6 * * 1'     # Her pazartesi 09:00 İstanbul: reklam planları
  workflow_dispatch:
    inputs:
      job:
        description: 'Hangi iş? (daily, policy_check, ad_plans, manual)'
        default: manual

concurrency:
  group: collect-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      GOOGLE_PLAY_SA_JSON: ${{ secrets.GOOGLE_PLAY_SA_JSON }}
      PLAY_REPORTS_BUCKET: ${{ secrets.PLAY_REPORTS_BUCKET }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      ASC_VENDOR_NUMBER: ${{ secrets.ASC_VENDOR_NUMBER }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
      VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Claude Code'u kur
        if: env.CLAUDE_CODE_OAUTH_TOKEN != ''
        run: npm install -g @anthropic-ai/claude-code
      - name: Hangi işin çalışacağını belirle
        id: which
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "job=${{ inputs.job }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "30 */6 * * *" ]; then
            echo "job=policy_check" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 6 * * 1" ]; then
            echo "job=ad_plans" >> "$GITHUB_OUTPUT"
          else
            echo "job=daily" >> "$GITHUB_OUTPUT"
          fi
      - name: Çalıştır
        run: node scripts/collect.mjs "${{ steps.which.outputs.job }}"
